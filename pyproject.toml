[project]
name = "jmedqa-eval"
version = "0.2.0"
description = "Evaluation pipeline for LLMs and VLMs on JMedQA (Japanese medical licensing exam QA)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "numpy>=1.26",
    "openai-harmony>=0.0.4",
    "pandas>=2.0",
    "pillow>=10",
    "tqdm>=4.66",
    "transformers>=5.0",
    "vllm>=0.30",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "jupyter>=1.1.1"]