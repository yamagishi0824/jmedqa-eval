[project]
name = "jmedqa-eval"
version = "0.1.0"
description = "Evaluation pipeline for LLMs on JMedQA (Japanese medical licensing exam QA)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.0,<2",
    "datasets>=3.0,<5",
    "ipykernel>=6,<8",
    "jupyter>=1.1.1",
    "numpy>=1.26,<2.3",
    "pandas>=2.0,<3",
    "sentencepiece>=0.2.0",
    "tqdm>=4.66",
    "transformers>=4.55,<5",
    "vllm>=0.10.0,<0.11",
    "torch>=2.7,<2.9",
]